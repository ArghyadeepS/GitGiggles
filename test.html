<!DOCTYPE html>
<html>
<body>
<script>
fetch('http://localhost:8000/api/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({github_url: 'octocat'})
})
.then(r => r.json())
.then(d => console.log('ANALYZE SUCCESS', d))
.catch(e => console.error('ANALYZE ERROR', e));

fetch('http://localhost:8000/api/roast', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({github_url: 'octocat'})
})
.then(r => r.json())
.then(d => console.log('ROAST SUCCESS', d))
.catch(e => console.error('ROAST ERROR', e));
</script>
</body>
</html>
